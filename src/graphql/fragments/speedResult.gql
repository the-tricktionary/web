fragment SpeedParticipantBase on SpeedParticipant {
  segmentIndex
  member {
    id
    name
    user {
      id
    }
  }
}

fragment SpeedResultBase on SpeedResult {
  id
  name
  createdAt
  count
  counted
  eventDefinition {
    id
    name
    totalDuration
  }
  group {
    id
    name
  }
  participants {
    ...SpeedParticipantBase
  }
}

# Only a score's own page asks who may share and assign it
fragment SpeedResultSharing on SpeedResult {
  id
  creator {
    id
  }
  group {
    id
    myMembership {
      id
      role
    }
  }
}
