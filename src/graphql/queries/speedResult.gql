query SpeedResult ($speedResultId: ID!) {
  me {
    id
    speedResult (speedResultId: $speedResultId) {
      ...SpeedResultBase
      ...SpeedResultSharing
      ...SpeedResultSegments
      # The event's own switches decide how many counts the edit form can take
      eventDefinition {
        id
        timingTrack {
          cues {
            type
            offset
            label
          }
        }
      }
      analysis {
        ...SpeedAnalysisFields
      }
    }
  }
}
